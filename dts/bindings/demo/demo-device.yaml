description: |
  A virtual demo device with no real hardware backing.
  Used to demonstrate how to build a custom Zephyr driver class
  with enable/disable/get_status API and Zephyr logging.

  Example definition in devicetree:

    demo_dev: demo-device {
        compatible = "demo-device";
        label = "MY_DEMO";
    };

compatible: "demo-device"

include: base.yaml

properties:
  label:
    type: string
    description: |
      Human-readable name for this demo device instance.
      Used in log messages so you can distinguish multiple instances.
  numeric_id:
    type: int
    description: |
      An optional numeric ID for this demo device instance.
      Used in log messages so you can distinguish multiple instances.
